name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            asset: kern-linux-x86_64
          - os: macos-14
            target: darwin-arm64
            asset: kern-darwin-arm64
          - os: windows-latest
            target: windows-x86_64
            asset: kern-windows-x86_64.exe
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
      - name: Install pinned tools
        run: rokit install --no-trust-check
      - name: Confirm managed toolchain
        run: |
          rokit list
          lute --version
      - name: Verify generated runtime inputs
        shell: bash
        run: |
          lute run scripts/generate_modules.luau
          lute run scripts/generate_types.luau
          git diff --exit-code -- src/cli/gen/modules.luau src/cli/gen/types.luau
      - name: Compile native binary
        run: lute run scripts/cd.luau bin/${{ matrix.asset }}
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: bin/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Ensure the tag matches Kern's embedded version
        run: lute run scripts/check_release_version.luau ${{ github.ref_name }}
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kern-*
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes

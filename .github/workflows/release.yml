name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build ${{ matrix.target }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux-x86_64
                      binary: kern-linux-x86_64
                      executable: kern
                      asset: kern-linux-x86_64.zip
                    - os: macos-14
                      target: darwin-arm64
                      binary: kern-darwin-arm64
                      executable: kern
                      asset: kern-darwin-arm64.zip
                    - os: windows-latest
                      target: windows-x86_64
                      binary: kern-windows-x86_64.exe
                      executable: kern.exe
                      asset: kern-windows-x86_64.zip
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7
            - name: Install Rokit
              uses: CompeyDev/setup-rokit@v0.1.2
            - name: Install pinned tools
              run: rokit install --no-trust-check
            - name: Confirm managed toolchain
              run: |
                  rokit list
                  lute --version
            - name: Verify generated runtime inputs
              shell: bash
              run: |
                  lute run scripts/generate_modules.luau
                  lute run scripts/generate_types.luau
                  git diff --exit-code -- src/cli/gen/modules.luau src/cli/gen/types.luau
            - name: Compile native binary
              run: lute run scripts/cd.luau bin/${{ matrix.binary }}
            - name: Package Unix Rokit archive
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  mkdir release
                  cp "bin/${{ matrix.binary }}" "release/${{ matrix.executable }}"
                  zip -j "${{ matrix.asset }}" "release/${{ matrix.executable }}"
            - name: Package Windows Rokit archive
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force release
                  Copy-Item "bin/${{ matrix.binary }}" "release/${{ matrix.executable }}"
                  Compress-Archive -Path "release/${{ matrix.executable }}" -DestinationPath "${{ matrix.asset }}" -Force
            - name: Upload release artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.asset }}
                  path: ${{ matrix.asset }}
                  if-no-files-found: error

    publish:
        name: Publish GitHub release
        needs: build
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7
            - name: Install Rokit
              uses: CompeyDev/setup-rokit@v0.1.2
            - name: Install pinned tools
              run: rokit install --no-trust-check
            - name: Ensure the tag matches kern's embedded version
              run: lute run scripts/check_release_version.luau ${{ github.ref_name }}
            - name: Download release artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: kern-*.zip
                  path: release
                  merge-multiple: true
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes --title "kern $GITHUB_REF_NAME"
